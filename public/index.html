<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0f12">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg">
<link rel="apple-touch-icon" href="/icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Corridas</title>
<style>
:root{--bg:#0d0f12;--card:#161a1f;--line:#252b33;--tx:#e9edf1;--mut:#8a94a1;--ac:#2fd27a;--ac2:#4aa3ff;--warn:#ffb020;--bad:#ff5a5f}
@media (prefers-color-scheme:light){:root:not([data-t=d]){--bg:#f4f6f8;--card:#fff;--line:#e3e7ec;--tx:#14181d;--mut:#66707c;--ac:#119a52;--ac2:#1f6fd1;--warn:#b7770a;--bad:#d33}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:max(10px,env(safe-area-inset-top)) 12px 90px}
main{max-width:560px;margin:0 auto}
h1{font-size:13px;font-weight:600;color:var(--mut);margin:4px 2px 8px;display:flex;justify-content:space-between}
.c{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.big{font-size:38px;font-weight:700;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.mut{color:var(--mut);font-size:12px}
.row{display:flex;gap:8px;align-items:center}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.g4 div{background:var(--bg);border-radius:10px;padding:7px 6px;text-align:center}
.g4 b{display:block;font-size:15px;font-variant-numeric:tabular-nums}
.g4 span{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.3px}
.bar{height:8px;background:var(--bg);border-radius:6px;overflow:hidden;margin:6px 0 2px}
.bar i{display:block;height:100%;background:var(--ac);border-radius:6px;transition:width .4s}
.meta{margin-top:8px}.meta .row{justify-content:space-between;font-size:13px}
input,select,button{font:inherit;color:inherit}
input,select{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px;width:100%;min-width:0}
button{border:0;border-radius:10px;padding:11px 14px;background:var(--line);font-weight:600;cursor:pointer}
button.p{background:var(--ac);color:#04140b}
button.s{background:transparent;border:1px solid var(--line)}
.chips{display:flex;gap:6px;margin-bottom:8px}.chips button{flex:1;padding:8px;font-size:13px;background:var(--bg)}
.chips button.on{background:var(--ac2);color:#fff}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 6px max(6px,env(safe-area-inset-bottom))}
nav button{flex:1;background:none;font-size:12px;color:var(--mut);padding:8px 0}
nav button.on{color:var(--ac)}
.tab{display:none}.tab.on{display:block}
.it{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.it:last-child{border:0}.it .v{margin-left:auto;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.it .x{background:none;color:var(--mut);padding:4px 8px}
.ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:14px;background:var(--bg);flex:none}
.dh{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin:14px 2px 4px;font-weight:600}
.tag{font-size:10px;border:1px solid var(--line);border-radius:6px;padding:1px 5px;color:var(--mut);margin-left:4px}
.ins{padding:10px 0;border-bottom:1px solid var(--line)}.ins:last-child{border:0}
.ins b{display:block;margin-bottom:2px}
svg text{fill:var(--mut);font-size:10px}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;max-width:90%}
.toast.on{opacity:1}
.sess{display:flex;justify-content:space-between;align-items:center}
.on-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ac);margin-right:6px;animation:p 1.6s infinite}
@keyframes p{50%{opacity:.3}}
label{font-size:12px;color:var(--mut);display:block;margin:6px 0 3px}
</style>
</head>
<body>
<main>
  <h1><span id="hoje"></span><span id="sync">…</span></h1>

  <section class="c">
    <div class="mut">Ganho hoje</div>
    <div class="row" style="justify-content:space-between;align-items:baseline">
      <div class="big" id="gDia">R$ 0</div>
      <div class="mut" style="text-align:right">projeção<br><b id="pDia" style="font-size:15px;color:var(--tx)">—</b></div>
    </div>
    <div class="g4">
      <div><b id="kH">—</b><span>R$/hora</span></div>
      <div><b id="kKm">—</b><span>R$/km</span></div>
      <div><b id="kN">0</b><span>corridas</span></div>
      <div><b id="kL">—</b><span>lucro</span></div>
    </div>
    <div id="metas"></div>
  </section>

  <section class="c sess">
    <div><div id="sTxt" class="mut">Sessão parada</div><div id="sInfo" style="font-weight:600"></div></div>
    <button id="sBtn" class="p">Iniciar</button>
  </section>

  <section class="c">
    <form id="qf" class="row">
      <input id="q" placeholder='25,50 joão 14:30 · odo 45230 · gas 150' autocomplete="off" enterkeyhint="send">
      <button class="p" aria-label="Lançar">＋</button>
    </form>
    <div class="mut" style="margin-top:6px;display:flex;justify-content:space-between">
      <span>Mesmo formato do WhatsApp</span><a href="#" id="tgF" style="color:var(--ac2)">formulário</a>
    </div>
    <form id="ff" hidden style="margin-top:10px">
      <div class="chips" id="tipoC">
        <button type="button" data-t="ganho" class="on">Ganho</button>
        <button type="button" data-t="odometro">Odômetro</button>
        <button type="button" data-t="despesa">Despesa</button>
      </div>
      <div class="f2">
        <div><label id="lV">Valor (R$)</label><input id="fV" inputmode="decimal" required></div>
        <div><label>Horário</label><input id="fT" type="time"></div>
        <div id="wP"><label>Passageiro</label><input id="fP" autocomplete="off"></div>
        <div id="wK"><label>Km da corrida</label><input id="fK" inputmode="decimal"></div>
        <div id="wC" hidden><label>Categoria</label><select id="fC">
          <option value="combustivel">Combustível</option><option value="alimentacao">Alimentação</option>
          <option value="manutencao">Manutenção</option><option value="lavagem">Lavagem</option>
          <option value="aluguel">Aluguel</option><option value="outros">Outros</option></select></div>
      </div>
      <button class="p" style="width:100%">Salvar</button>
    </form>
  </section>

  <div id="t-lista" class="tab on"><div id="lista"></div><button class="s" id="mais" style="width:100%;margin-top:8px" hidden>Ver mais</button></div>
  <div id="t-graf" class="tab"></div>
  <div id="t-ins" class="tab"></div>
  <div id="t-cfg" class="tab">
    <form class="c" id="cf">
      <div class="f2">
        <div><label>Meta do dia (R$)</label><input name="meta_dia" inputmode="decimal"></div>
        <div><label>Meta da semana (R$)</label><input name="meta_semana" inputmode="decimal"></div>
        <div><label>Meta por sessão (R$)</label><input name="meta_sessao" inputmode="decimal"></div>
        <div><label>Horas por dia</label><input name="horas_dia" inputmode="decimal"></div>
        <div><label>Dias por semana</label><input name="dias_semana" inputmode="numeric"></div>
        <div><label>Custo por km (R$)</label><input name="custo_km" inputmode="decimal"></div>
      </div>
      <div class="mut" style="margin-bottom:8px">Custo/km = combustível + manutenção + desgaste. Ex.: carro 10 km/L, gasolina R$ 6 → R$ 0,60 só de combustível.</div>
      <button class="p" style="width:100%">Salvar metas</button>
    </form>
    <div class="c mut" id="ajuda"></div>
  </div>
</main>

<nav>
  <button data-tab="lista" class="on">Lançamentos</button>
  <button data-tab="graf">Gráficos</button>
  <button data-tab="ins">Insights</button>
  <button data-tab="cfg">Metas</button>
</nav>
<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const R=v=>'R$ '+(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const R0=v=>'R$ '+Math.round(v||0).toLocaleString('pt-BR');
const N1=v=>(v||0).toLocaleString('pt-BR',{maximumFractionDigits:1});
const pad=n=>String(n).padStart(2,'0');
const dk=d=>{d=new Date(d);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const hm=d=>{d=new Date(d);return pad(d.getHours())+':'+pad(d.getMinutes())};
const DS=['dom','seg','ter','qua','qui','sex','sáb'];
const weekStart=d=>{d=new Date(d);d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d};
const DEF={meta_dia:300,meta_semana:1800,meta_sessao:150,horas_dia:8,dias_semana:6,custo_km:.45};
let rows=JSON.parse(localStorage.rows||'[]'), cfg={...DEF,...JSON.parse(localStorage.cfg||'{}')}, M={}, shown=60;

function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2200)}
async function api(path,opt={}){
  const r=await fetch('/api/'+path,{...opt,headers:{'Content-Type':'application/json','x-token':localStorage.tk||''}});
  if(r.status===401){const t=prompt('Código de acesso da app:');if(t){localStorage.tk=t;return api(path,opt)}throw Error('sem acesso')}
  const j=await r.json(); if(!r.ok) throw Error(j.error||r.status); return j;
}
async function load(){
  try{
    const [r,c]=await Promise.all([api('entries?days=90'),api('config')]);
    rows=r; cfg={...DEF,...c}; localStorage.rows=JSON.stringify(r); localStorage.cfg=JSON.stringify(cfg);
    $('#sync').textContent='atualizado '+hm(new Date());
  }catch(e){$('#sync').textContent='offline'}
  render();
}

/* ---------- cálculos ---------- */
function compute(){
  const asc=[...rows].sort((a,b)=>new Date(a.ts)-new Date(b.ts)), now=Date.now();
  const days={}, D=k=>days[k]||(days[k]={g:0,d:0,n:0,kmT:0,odo:[],min:0,first:null,last:null,byH:{}});
  const sess=[]; let open=null;
  for(const r of asc){
    const t=new Date(r.ts), d=D(dk(t)), v=+r.valor||0;
    if(r.tipo==='ganho'){d.g+=v;d.n++;d.kmT+=+r.km||0;d.first=d.first||t;d.last=t;const h=t.getHours();d.byH[h]=(d.byH[h]||0)+v}
    else if(r.tipo==='despesa') d.d+=v;
    else if(r.tipo==='odometro'&&v) d.odo.push(v);
    else if(r.tipo==='sessao_ini'){if(open)close(open,t);open={ini:t,odo0:v||null};if(v)d.odo.push(v)}
    else if(r.tipo==='sessao_fim'){if(v)d.odo.push(v);if(open){open.odo1=v||null;close(open,t);open=null}}
  }
  function close(s,t){s.fim=t;sess.push(s)}
  let ativa=null;
  if(open){ if(now-open.ini<16*36e5){ativa=open;sess.push({...open,fim:new Date(),ativa:true})} else sess.push({...open,fim:new Date(+open.ini+36e5)}) }
  // minutos por dia e por hora-do-dia (para R$/h por faixa)
  const hrsByH=Array(24).fill(0);
  for(const s of sess){
    D(dk(s.ini)).min+=(s.fim-s.ini)/6e4;
    for(let t=+s.ini;t<+s.fim;t+=6e4*5) hrsByH[new Date(t).getHours()]+=5/60;
  }
  for(const k in days){const d=days[k];
    d.h=d.min?d.min/60:(d.n?Math.max(.5,(d.last-d.first)/36e5+.33):0);
    const o=d.odo.filter(x=>x>1000).sort((a,b)=>a-b);
    d.km=o.length>1?o[o.length-1]-o[0]:d.kmT;
  }
  // ganhos dentro das sessões
  for(const s of sess){s.g=0;s.n=0;for(const r of asc) if(r.tipo==='ganho'){const t=new Date(r.ts);if(t>=s.ini&&t<=s.fim){s.g+=+r.valor;s.n++}}}
  return {days,sess,ativa,hrsByH,asc,D};
}

function render(){
  M=compute(); const {days,sess,ativa}=M, now=new Date(), k=dk(now), d=days[k]||{g:0,d:0,n:0,km:0,h:0};
  $('#hoje').textContent=now.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'short'});
  $('#gDia').textContent=R(d.g);
  $('#kH').textContent=d.h?R0(d.g/d.h):'—';
  $('#kKm').textContent=d.km?(d.g/d.km).toFixed(2).replace('.',','):'—';
  $('#kN').textContent=d.n;
  const lucro=d.g-d.d-(d.km||0)*cfg.custo_km;
  $('#kL').textContent=d.n?R0(lucro):'—';

  // semana
  const ws=weekStart(now); let gs=0, worked=0;
  for(const key in days){const t=new Date(key+'T12:00');if(t>=ws){gs+=days[key].g;if(days[key].n)worked++}}
  // médias históricas (28 dias trabalhados)
  const past=Object.entries(days).filter(([key,v])=>key<k&&v.n).slice(-28);
  const avgDay=past.length?past.reduce((s,[,v])=>s+v.g,0)/past.length:0;
  const wd=now.getDay(), sameWd=past.filter(([key])=>new Date(key+'T12:00').getDay()===wd);
  const avgWd=sameWd.length?sameWd.reduce((s,[,v])=>s+v.g,0)/sameWd.length:avgDay;
  // projeção do dia: ritmo atual × horas restantes da jornada
  let pDia;
  if(d.h>.5){pDia=d.g+(d.g/d.h)*Math.max(0,cfg.horas_dia-d.h)}
  else pDia=Math.max(d.g,avgWd);
  $('#pDia').textContent=pDia?R0(pDia):'—';
  const restDias=Math.max(0,cfg.dias_semana-worked-(d.n?0:1));
  const pSem=gs-d.g+Math.max(d.g,pDia)+restDias*(avgDay||pDia);
  // sessão
  const sAtual=ativa?sess[sess.length-1]:null;
  const ms=[['Dia',d.g,cfg.meta_dia,pDia],['Semana',gs,cfg.meta_semana,pSem]];
  if(sAtual) ms.push(['Sessão',sAtual.g,cfg.meta_sessao,null]);
  $('#metas').innerHTML=ms.map(([n,v,m,p])=>{const pc=Math.min(100,v/m*100||0);
    return `<div class="meta"><div class="row"><span>${n} <span class="mut">${R0(v)} / ${R0(m)}</span></span><span class="mut">${v>=m?'✅ batida':'faltam '+R0(m-v)}${p?' · proj. '+R0(p):''}</span></div><div class="bar"><i style="width:${pc}%;background:${pc>=100?'var(--ac)':pc>60?'var(--ac2)':'var(--warn)'}"></i></div></div>`}).join('');

  // botão sessão
  if(sAtual){const min=(now-sAtual.ini)/6e4;
    $('#sTxt').innerHTML='<span class="on-dot"></span>Sessão desde '+hm(sAtual.ini);
    $('#sInfo').textContent=`${Math.floor(min/60)}h${pad(Math.round(min%60))} · ${R(sAtual.g)} · ${sAtual.n} corridas`+(min>20?` · ${R0(sAtual.g/(min/60))}/h`:'');
    $('#sBtn').textContent='Encerrar';$('#sBtn').className='s';
  }else{$('#sTxt').textContent='Sessão parada';$('#sInfo').textContent=d.h?`Hoje: ${N1(d.h)}h rodadas`:'';$('#sBtn').textContent='Iniciar';$('#sBtn').className='p'}

  renderLista(); renderGraf(); renderIns({d,pDia,gs,pSem,avgDay,sAtual});
}

/* ---------- lista ---------- */
const ICON={ganho:['💵','var(--ac)'],despesa:['⛽','var(--bad)'],odometro:['🧭',''],sessao_ini:['▶️',''],sessao_fim:['⏹','']};
function renderLista(){
  const groups={};for(const r of rows.slice(0,shown))(groups[dk(r.ts)]||=[]).push(r);
  let h='';
  for(const [key,items] of Object.entries(groups)){
    const d=M.days[key]||{}, t=new Date(key+'T12:00');
    h+=`<div class="dh"><span>${DS[t.getDay()]} ${t.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})}</span><span>${R(d.g)}${d.h?' · '+N1(d.h)+'h':''}${d.km?' · '+Math.round(d.km)+' km':''}</span></div><div class="c" style="padding:2px 12px">`;
    for(const r of items){
    const [ic,col]=ICON[r.tipo]||['•',''];
    const titulo=r.tipo==='ganho'?(r.passageiro||'Corrida'):r.tipo==='despesa'?(r.categoria||'Despesa'):r.tipo==='odometro'?'Odômetro':r.tipo==='sessao_ini'?'Início da sessão':'Fim da sessão';
    const val=r.tipo==='ganho'?'+'+R(+r.valor):r.tipo==='despesa'?'−'+R(+r.valor):r.valor?Number(r.valor).toLocaleString('pt-BR')+' km':'';
    h+=`<div class="it"><div class="ic">${ic}</div><div><div>${esc(titulo)}${r.origem!=='manual'?`<span class="tag">${r.origem==='whatsapp'?'whats':r.origem}</span>`:''}</div><div class="mut">${hm(r.ts)}${r.km?' · '+N1(r.km)+' km':''}${r.obs?' · '+esc(r.obs):''}</div></div><div class="v" style="color:${col}">${val}</div><button class="x" data-del="${r.id}">×</button></div>`;
    }
    h+='</div>';
  }
  $('#lista').innerHTML=h||'<div class="c mut">Nenhum lançamento ainda. Digite acima, ex.: <b>25,50 joão</b></div>';
  $('#mais').hidden=rows.length<=shown;
}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- gráficos (SVG puro) ---------- */
function bars(data,{h=150,meta=null,fmt=R0,color='var(--ac)'}={}){
  const W=520,pl=4,pb=18,max=Math.max(meta||0,...data.map(d=>d.v),1)*1.1,bw=(W-pl)/data.length;
  let s=`<svg viewBox="0 0 ${W} ${h}" width="100%" role="img">`;
  data.forEach((d,i)=>{const bh=(d.v/max)*(h-pb-22),x=pl+i*bw+bw*.15,y=h-pb-bh;
    s+=`<rect x="${x}" y="${y}" width="${bw*.7}" height="${Math.max(bh,0)}" rx="3" fill="${d.c||color}" opacity="${d.dim?.45:1}"><title>${d.l}: ${fmt(d.v)}</title></rect>`;
    if(d.v&&data.length<=16) s+=`<text x="${x+bw*.35}" y="${y-3}" text-anchor="middle">${d.v>=1000?(d.v/1000).toFixed(1)+'k':Math.round(d.v)}</text>`;
    if(data.length<=16||i%2===0) s+=`<text x="${x+bw*.35}" y="${h-5}" text-anchor="middle">${d.l}</text>`});
  if(meta){const y=h-pb-(meta/max)*(h-pb-22);s+=`<line x1="0" x2="${W}" y1="${y}" y2="${y}" stroke="var(--warn)" stroke-dasharray="4 4"/><text x="${W-2}" y="${y-3}" text-anchor="end" style="fill:var(--warn)">meta</text>`}
  return s+'</svg>';
}
function renderGraf(){
  const {days,hrsByH}=M, now=new Date(), d14=[];
  for(let i=13;i>=0;i--){const t=new Date(now);t.setDate(t.getDate()-i);const v=days[dk(t)]||{};d14.push({l:i?DS[t.getDay()].slice(0,1)+t.getDate():'hoje',v:v.g||0})}
  // R$/h por faixa horária (30 dias)
  const lim=Date.now()-30*864e5, gH=Array(24).fill(0), nH=Array(24).fill(0);
  for(const r of rows) if(r.tipo==='ganho'&&new Date(r.ts)>lim){const h=new Date(r.ts).getHours();gH[h]+=+r.valor;nH[h]++}
  const useRate=hrsByH.some(x=>x>0);
  const perH=gH.map((g,h)=>({l:String(h),v:useRate?(hrsByH[h]>.25?g/hrsByH[h]:0):g}));
  // por dia da semana (média)
  const wsum=Array(7).fill(0),wn=Array(7).fill(0);
  for(const [key,v] of Object.entries(days)) if(v.n){const w=new Date(key+'T12:00').getDay();wsum[w]+=v.g;wn[w]++}
  const wk=[1,2,3,4,5,6,0].map(w=>({l:DS[w],v:wn[w]?wsum[w]/wn[w]:0}));
  // semanas
  const ws={};for(const [key,v] of Object.entries(days)){const s=dk(weekStart(key+'T12:00'));ws[s]=(ws[s]||0)+v.g}
  const sem=Object.entries(ws).sort().slice(-8).map(([s,v])=>({l:s.slice(8)+'/'+s.slice(5,7),v}));
  $('#t-graf').innerHTML=
   `<div class="c"><b>Ganhos — 14 dias</b>${bars(d14,{meta:cfg.meta_dia})}</div>`+
   `<div class="c"><b>${useRate?'R$ por hora rodada':'Ganhos'} por horário</b> <span class="mut">30 dias</span>${bars(perH,{h:130,color:'var(--ac2)'})}</div>`+
   `<div class="c"><b>Média por dia da semana</b>${bars(wk,{h:130,meta:cfg.meta_dia})}</div>`+
   `<div class="c"><b>Semanas</b>${bars(sem,{h:130,meta:cfg.meta_semana,color:'var(--ac2)'})}</div>`;
}

/* ---------- insights ---------- */
function renderIns({d,pDia,gs,pSem,avgDay,sAtual}){
  const {days,hrsByH}=M, out=[], now=new Date();
  const list=Object.entries(days).filter(([,v])=>v.n);
  const add=(t,x)=>out.push(`<div class="ins"><b>${t}</b><span class="mut">${x}</span></div>`);
  if(!list.length){$('#t-ins').innerHTML='<div class="c mut">Lance algumas corridas (com início/fim de sessão e odômetro) para ver insights.</div>';return}
  // ritmo para meta
  const falta=cfg.meta_dia-d.g;
  if(falta>0&&d.h>.25){const rate=d.g/d.h;add('🎯 Meta do dia',`Faltam ${R0(falta)}. No seu ritmo (${R0(rate)}/h) são mais ${N1(falta/rate)}h.`)}
  else if(falta<=0) add('✅ Meta do dia batida',`Você passou ${R0(-falta)} da meta. Tudo daqui pra frente é extra.`);
  if(pSem<cfg.meta_semana){const rest=Math.max(1,cfg.dias_semana-list.filter(([k])=>new Date(k+'T12:00')>=weekStart(now)).length);
    add('📅 Semana',`Projeção ${R0(pSem)} de ${R0(cfg.meta_semana)}. Para bater, faça ~${R0((cfg.meta_semana-gs)/rest)} por dia nos ${rest} dia(s) restantes.`)}
  // melhores horários (R$/h)
  const lim=Date.now()-30*864e5, gH=Array(24).fill(0);
  for(const r of rows) if(r.tipo==='ganho'&&new Date(r.ts)>lim) gH[new Date(r.ts).getHours()]+=+r.valor;
  if(hrsByH.some(x=>x>0)){
    const rate=gH.map((g,h)=>({h,r:hrsByH[h]>=1?g/hrsByH[h]:null})).filter(x=>x.r!=null).sort((a,b)=>b.r-a.r);
    if(rate.length>=3){const top=rate.slice(0,3),bot=rate.slice(-2);
      add('⏰ Horários que mais pagam',`${top.map(x=>`${x.h}h (${R0(x.r)}/h)`).join(', ')}. Os piores: ${bot.map(x=>`${x.h}h (${R0(x.r)}/h)`).join(', ')} — considere pausar/almoçar nesses.`)}
  }else{const top=gH.map((g,h)=>({h,g})).sort((a,b)=>b.g-a.g).slice(0,3).filter(x=>x.g);
    if(top.length) add('⏰ Horários com mais ganho',`${top.map(x=>x.h+'h').join(', ')}. Use Iniciar/Encerrar sessão para calcular R$/hora real por horário.`)}
  // dia da semana
  const ws=Array(7).fill(0),wh=Array(7).fill(0);for(const [k,v] of list){const w=new Date(k+'T12:00').getDay();ws[w]+=v.g;wh[w]+=v.h}
  const wr=ws.map((g,w)=>({w,r:wh[w]?g/wh[w]:0})).filter(x=>x.r).sort((a,b)=>b.r-a.r);
  if(wr.length>=3) add('📆 Melhores dias',`${wr.slice(0,2).map(x=>`${DS[x.w]} (${R0(x.r)}/h)`).join(' e ')}. Pior: ${DS[wr[wr.length-1].w]} (${R0(wr[wr.length-1].r)}/h). Se for folgar, folgue no pior.`);
  // R$/km e custo
  const tot=list.reduce((a,[,v])=>({g:a.g+v.g,km:a.km+v.km,d:a.d+v.d,n:a.n+v.n,h:a.h+v.h}),{g:0,km:0,d:0,n:0,h:0});
  if(tot.km>0){const rk=tot.g/tot.km, liq=rk-cfg.custo_km;
    add('🛣️ Ganho por km',`Média ${R(rk)}/km rodado; descontando custo (${R(cfg.custo_km)}/km) sobra ${R(liq)}/km. ${rk<2?'Abaixo de R$ 2/km rodado: muito km vazio — fique parado em ponto estratégico em vez de rodar procurando.':'Bom aproveitamento.'} Aceite corridas que paguem pelo menos ~${R(Math.max(1.5,rk))}/km.`)}
  else add('🛣️ Lance o odômetro','Registre o odômetro no início e no fim (ex.: "inicio 45100" / "fim 45230") para calcular R$/km e lucro real.');
  // ticket
  const gan=rows.filter(r=>r.tipo==='ganho'&&new Date(r.ts)>lim), tk=gan.reduce((s,r)=>s+ +r.valor,0)/(gan.length||1);
  const curtas=gan.filter(r=>+r.valor<10).length;
  if(gan.length>=10) add('🎟️ Ticket médio',`${R(tk)} por corrida (${gan.length} em 30 dias). ${curtas/gan.length>.35?`${Math.round(curtas/gan.length*100)}% abaixo de R$ 10 — corridas curtas comem tempo de deslocamento; priorize as mais longas nos horários de pico.`:'Boa proporção de corridas médias/longas.'}`);
  // despesas
  if(tot.d>0) add('⛽ Despesas',`${Math.round(tot.d/tot.g*100)}% do faturamento vai para despesas lançadas (${R0(tot.d)}). ${tot.d/tot.g>.35?'Está alto: compare preço de combustível, calibre pneus e evite rodar vazio.':''}`);
  // tendência semanal
  const ws0=weekStart(now), wPrev=new Date(+ws0-7*864e5), dayIdx=(now.getDay()+6)%7;
  let cur=0,prev=0;for(const [k,v] of list){const t=new Date(k+'T12:00');if(t>=ws0)cur+=v.g;else if(t>=wPrev&&(t.getDay()+6)%7<=dayIdx)prev+=v.g}
  if(prev) add(cur>=prev?'📈 Semana acima da anterior':'📉 Semana abaixo da anterior',`${R0(cur)} vs ${R0(prev)} no mesmo ponto da semana passada (${cur>=prev?'+':''}${Math.round((cur/prev-1)*100)}%).`);
  // horas médias
  const hd=tot.h/list.length; add('⌛ Jornada',`Média de ${N1(hd)}h/dia e ${R0(avgDay)}/dia nos dias trabalhados (${R0(tot.g/(tot.h||1))}/h).`);
  $('#t-ins').innerHTML='<div class="c">'+out.join('')+'</div>';
}

/* ---------- ações ---------- */
async function salvar(body){
  try{const r=await api('entries',{method:'POST',body:JSON.stringify(body)});rows=[...r,...rows].sort((a,b)=>new Date(b.ts)-new Date(a.ts));
    localStorage.rows=JSON.stringify(rows);render();toast('Salvo ✓ '+r.map(x=>x.tipo==='ganho'?R(+x.valor):x.tipo).join(', '));return true}
  catch(e){toast(e.message);return false}
}
$('#qf').onsubmit=async e=>{e.preventDefault();const v=$('#q').value.trim();if(v&&await salvar({text:v}))$('#q').value=''};
$('#tgF').onclick=e=>{e.preventDefault();$('#ff').hidden=!$('#ff').hidden;$('#fT').value=hm(new Date())};
let tipo='ganho';
$('#tipoC').onclick=e=>{const b=e.target.closest('button');if(!b)return;tipo=b.dataset.t;$$('#tipoC button').forEach(x=>x.classList.toggle('on',x===b));
  $('#lV').textContent=tipo==='odometro'?'Odômetro (km)':'Valor (R$)';$('#wP').hidden=$('#wK').hidden=tipo!=='ganho';$('#wC').hidden=tipo!=='despesa'};
$('#ff').onsubmit=async e=>{e.preventDefault();const t=new Date();if($('#fT').value){const [h,m]=$('#fT').value.split(':');t.setHours(+h,+m,0,0);if(t>Date.now()+6e5)t.setDate(t.getDate()-1)}
  const num=s=>s?parseFloat(s.replace(/\./g,s.includes(',')?'':'.').replace(',','.')):null;
  const row={tipo,ts:t.toISOString(),valor:num($('#fV').value),origem:'manual'};
  if(tipo==='ganho'){row.passageiro=$('#fP').value.trim()||null;row.km=num($('#fK').value)}
  if(tipo==='despesa')row.categoria=$('#fC').value;
  if(await salvar({row})){$('#fV').value=$('#fP').value=$('#fK').value=''}};
$('#sBtn').onclick=async()=>{const ativa=!!M.ativa;const o=prompt((ativa?'Encerrar':'Iniciar')+' sessão — odômetro atual (opcional):','');if(o===null)return;
  await salvar({row:{tipo:ativa?'sessao_fim':'sessao_ini',ts:new Date().toISOString(),valor:o?parseFloat(o.replace(/\D/g,'')):null,origem:'manual'}})};
$('#lista').onclick=async e=>{const id=e.target.dataset.del;if(!id||!confirm('Apagar lançamento?'))return;
  try{await api('entries?id='+id,{method:'DELETE'});rows=rows.filter(r=>r.id!=id);localStorage.rows=JSON.stringify(rows);render()}catch(x){toast(x.message)}};
$('#mais').onclick=()=>{shown+=100;renderLista()};
$$('nav button').forEach(b=>b.onclick=()=>{$$('nav button').forEach(x=>x.classList.toggle('on',x===b));$$('.tab').forEach(t=>t.classList.toggle('on',t.id==='t-'+b.dataset.tab));
  if(b.dataset.tab==='cfg')for(const k in DEF)$('#cf [name='+k+']').value=cfg[k]});
$('#cf').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),c={};for(const [k,v] of f)c[k]=parseFloat(String(v).replace(',','.'))||DEF[k];
  try{cfg={...DEF,...await api('config',{method:'POST',body:JSON.stringify(c)})};localStorage.cfg=JSON.stringify(cfg);render();toast('Metas salvas ✓')}catch(x){toast(x.message)}};
$('#ajuda').innerHTML=`<b style="color:var(--tx)">Como lançar (app ou grupo "Uber" no WhatsApp)</b><br>
<code>25,50 joão 14:30</code> corrida · <code>18 maria 6km</code> com km<br><code>odo 45230</code> odômetro · <code>gas 150</code> / <code>almoço 25</code> despesa<br>
<code>inicio 45100</code> / <code>fim 45230</code> sessão · várias linhas = vários lançamentos`;

render(); load();
setInterval(()=>{if(!document.hidden)load()},60e3);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});
</script>
